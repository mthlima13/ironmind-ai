# ==============================================================================
# IronMind AI - backend configuration
#
# Every credential is read from an environment variable with a development
# default. Never commit a real secret: use .env.example as the reference.
# ==============================================================================
spring:
  application:
    name: ironmind-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ironmind}
    username: ${DB_USER:ironmind}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema: Hibernate never creates or alters it, so the
    # migration history stays the single source of truth of the database.
    # "validate" makes the application fail fast when an entity drifts away
    # from the migrations.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    fail-on-error: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-swatch: false

app:
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
    jwt:
      # Replace it with a random value of 32 bytes or more before any real
      # deployment. The application boots with the default value, but it logs a
      # strong warning while doing so.
      secret: ${JWT_SECRET:change-me-32-bytes-minimum}
      ttl-seconds: ${JWT_TTL_SECONDS:900}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
      issuer: ${JWT_ISSUER:ironmind-ai}
    rate-limit:
      # Fixed window, kept in memory. The production version keeps the counters
      # in Redis, so the window is shared by every instance of the API.
      ip-multiplier: ${AUTH_RATE_LIMIT_IP_MULTIPLIER:4}
      login:
        max-requests: ${RATE_LIMIT_LOGIN_REQUESTS:10}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      register:
        max-requests: ${RATE_LIMIT_REGISTER_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      forgot-password:
        max-requests: ${RATE_LIMIT_FORGOT_PASSWORD_REQUESTS:5}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      refresh:
        max-requests: ${RATE_LIMIT_REFRESH_REQUESTS:30}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      reset-password:
        max-requests: ${RATE_LIMIT_RESET_PASSWORD_REQUESTS:10}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  mail:
    # "logging" only writes the recovery token in the log. A real provider must
    # replace it before the publication of the application.
    provider: ${MAIL_PROVIDER:logging}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:19007}
  llm:
    # The key of the provider is only read by the backend and never reaches the
    # mobile application.
    # "mock" answers deterministically and needs no credentials; "openai" calls
    # the real provider and fails fast when the key or the model is missing.
    provider: ${LLM_PROVIDER:mock}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    timeout-ms: ${LLM_TIMEOUT_MS:15000}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:2000}
    daily-quota-per-user: ${LLM_DAILY_QUOTA_PER_USER:50}
    # Resilience of the provider: a transient failure is retried a limited
    # number of times and a sequence of failures opens the circuit, so an
    # unavailable provider answers fast instead of holding every request.
    max-retries: ${LLM_MAX_RETRIES:1}
    circuit-breaker-failure-threshold: ${LLM_CIRCUIT_FAILURE_THRESHOLD:5}
    circuit-breaker-open-seconds: ${LLM_CIRCUIT_OPEN_SECONDS:30}
  ai:
    # Bounds applied to every structured answer, whatever the model returns.
    limits:
      max-days: ${AI_MAX_DAYS:7}
      max-exercises-per-day: ${AI_MAX_EXERCISES_PER_DAY:10}
      max-sets: ${AI_MAX_SETS:8}
      max-reps: ${AI_MAX_REPS:30}
      max-rest-seconds: ${AI_MAX_REST_SECONDS:600}
      max-catalog-exercises: ${AI_MAX_CATALOG_EXERCISES:80}
      default-reps-min: ${AI_DEFAULT_REPS_MIN:8}
      default-reps-max: ${AI_DEFAULT_REPS_MAX:12}
      default-rest-seconds: ${AI_DEFAULT_REST_SECONDS:90}
    rate-limit:
      max-requests: ${AI_RATE_LIMIT_REQUESTS:10}
      window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ironmind: ${LOG_LEVEL:INFO}

---
# Development profile: verbose application logs, Flyway on the info level.
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    com.ironmind: DEBUG
    org.flywaydb: INFO

---
# Test profile: used by the automated tests. The database connection is
# provided by Testcontainers when the integration tests run.
spring:
  config:
    activate:
      on-profile: test
  jpa:
    open-in-view: false
logging:
  level:
    root: WARN
    com.ironmind: INFO
    org.flywaydb: WARN
